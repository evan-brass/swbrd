<!DOCTYPE html>
<script type="importmap">{
	"imports": {
		"swbrd/": "./src/"
	}
}</script>
<script>
// Log everything.
async function log_everything(conns) {
	for (const key in conns) {
		const conn = conns[key];
		function logger(...args) {
			console.log(key, ...args);
		}
		if (conn.dc) {
			['message', 'open', 'close'].forEach((e) =>
				conn.dc.addEventListener(e, logger)
			);
		}
		[
			'connectionState',
			'iceConnectionState',
			'iceGatheringState',
			'signalingState',
		].forEach((p) => {
			conn.addEventListener(
				p.toLowerCase() + 'change',
				() => logger(p, conn[p]),
			);
		});
		[
			'icecandidate',
			'candidate',
			'datachannel',
			'icecandidateerror',
			'negotiationneeded',
			'track',
		].forEach((e) => {
			conn.addEventListener(e, logger);
		});

		while (!conn.sctp) {
			await new Promise(res => conn.addEventListener('signalingstatechange', res, { once: true }));
		}
		conn.sctp.addEventListener('statechange', ({ target: { state } }) => logger('sctp state', state));
		conn.sctp.transport.addEventListener('error', ({ error }) => logger('dtls error', error));
		conn.sctp.transport.iceTransport.addEventListener('gatheringstatechange', ({ target: { gatheringState } }) => logger('ice transport gatheringState', gatheringState));
		conn.sctp.transport.iceTransport.addEventListener('statechange', ({ target: { state } }) => logger('ice transport state', state));
		conn.sctp.transport.iceTransport.addEventListener('selectedcandidatepairchange', ({ target }) => logger('ice transport selected', target.getSelectedCandidatePair()));
	}
}
</script>
<script type="_module">
import { Conn } from 'swbrd/conn.js';

const h = Conn.to_server();
// const h = Conn.to_server_direct();
log_everything({ h });
</script>
<script type="_module">
import { Cert } from 'swbrd/cert.js';
import { Conn } from 'swbrd/conn.js';

const certa = await Cert.generate();
const certb = await Cert.generate();

const a = Conn.with_candidates(certb, { cert: certa });
const b = Conn.with_candidates(certa, { cert: certb });
// const a = Conn.with_candidates_dissolved(certb, { cert: certa });
// const b = Conn.with_candidates_dissolved(certa, { cert: certb });
a.addEventListener('candidate', ({candidate}) => b.addIceCandidate(candidate));
b.addEventListener('candidate', ({candidate}) => a.addIceCandidate(candidate));

log_everything({a, b});
</script>
<script type="module">
import { state } from './src/util.js';
const config = {
	iceServers: [{
		urls: 'turn:turn.evan-brass.net',
		username: 'user',
		credential: 'password',
	}],
	iceTransportPolicy: 'relay',
};

const a = new RTCPeerConnection(config);
const b = new RTCPeerConnection(config);

log_everything({a, b});

a.createDataChannel('');

await a.setLocalDescription();
while (a.iceGatheringState != 'complete') await state({ icegatheringstatechange: a });
await b.setRemoteDescription(a.localDescription);
await b.setLocalDescription();
while (b.iceGatheringState != 'complete') await state({ icegatheringstatechange: b });
await a.setRemoteDescription(b.localDescription);
</script>
