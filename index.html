<script type="module">
	const config = {
		iceTransportPolicy: 'relay', // Force relaying because I want to show the TURN server in action.
		iceServers: [{ urls: 'turn:localhost', username: 'guest', credential: 'password' }],
	};

	const a = new RTCPeerConnection(config);
	const b = new RTCPeerConnection(config);
	a.createDataChannel('');

	// Log connection states
	a.addEventListener('connectionstatechange', () => console.log('a', a.connectionState));
	b.addEventListener('connectionstatechange', () => console.log('b', b.connectionState));

	// Negotiate the connection
	await a.setLocalDescription();
	while (a.iceGatheringState != 'complete') await new Promise(res => a.addEventListener('icegatheringstatechange', res, { once: true }));
	await b.setRemoteDescription(a.localDescription);
	await b.setLocalDescription();
	while (b.iceGatheringState != 'complete') await new Promise(res => b.addEventListener('icegatheringstatechange', res, { once: true }));
	await a.setRemoteDescription(b.localDescription);
</script>

import { Addr } from '/src/addr.js';
import { Stun, MAGIC_COOKIE } from '/src/stun.js';

// Look through our URL to connect to addresses
for (let addr of new URLSearchParams(location.search).getAll('addr')) {
	addr = new Addr(decodeURIComponent(addr));
	const conn = addr.connect();
	console.log(addr, conn);
}

// Connect to my server
const server_addr = new Addr('turn:Zx9xDRd0OG9PxMGJhg3C8NDr65kn4kOivLoSNqXKCoW@stun.evan-brass.net?ice-lite');
// const server_addr = new Addr('turn:ucCm6JK3s22XuCRiTZVFpWajUq0tIpB7lDn1Sv8dRv3@localhost?ice-lite');

const server = server_addr.connect();

// Log everything
['message', 'open', 'close'].forEach(e => server.dc.addEventListener(e, console.log));
['connectionState', 'iceConnectionState', 'iceGatheringState', 'signalingState'].forEach(p => {
	server.addEventListener(p.toLowerCase() + 'change', ({ target }) => console.log(p, target[p]));
});
['icecandidate', 'datachannel', 'icecandidateerror', 'negotiationneeded', 'track'].forEach(e => {
	server.addEventListener(e, console.log);
});

// Assemble our address
while (!server.cert) await new Promise(res => server.addEventListener('signalingstatechange', res, { once: true }));
const ours = new URL(location);
ours.searchParams.set('addr', `turn:${server.cert}@${server_addr.authority.host}`);
console.log(ours.href);

// Listen for binary messages from the server
for (; ;) {
	const { data } = await new Promise(res => server.dc.addEventListener('message', res, { once: true }));
	if (!(data instanceof ArrayBuffer) || data.byteLength < Stun.minByteLength) { continue }
	const msg = new Stun(data);
	// if (msg.len != msg.byteLength) continue;
	// if (msg.cookie != MAGIC_COOKIE) continue;
	console.group(msg);
	for (const a of msg) {
		console.log(a);
	}
	console.groupEnd();
}
</script>

import { Cert } from './src/cert.js';
import { Conn } from './src/conn.js';

// -- Step 1: Get your certificates ready --
let certa, certb;
//  - Option 1: Reuse a certificate from IndexedDB (generating a new certificate if the existing cert is not present or has expired)

certb = await Cert.load('testb');

//  - Option 2: Generate fresh certificates
// certa = await Cert.generate();
// certb = await Cert.generate();


// -- Step 2: Turn your certificate into an id --
const ida = BigInt(certa);
const idb = BigInt(certb);


// -- Step 3: Create each side of the connection using your certificate and your peer's id --
const a = new Conn(idb, {cert: certa});
const b = new Conn(ida, {cert: certb});
// - Log the connection status
a.addEventListener('connectionstatechange', () => console.log('a', a.connectionState));
b.addEventListener('connectionstatechange', () => console.log('b', b.connectionState));


// -- Step 4: Pass ICE candidates (ip+port pairs) --
a.addEventListener('icecandidate', async ({candidate}) => await b.addIceCandidate(candidate));
b.addEventListener('icecandidate', async ({candidate}) => await a.addIceCandidate(candidate));


// -- Step 5: Add event listeners for incoming datachannels / tracks --
a.addEventListener('datachannel', ({channel}) => console.log('datachannel from b', channel));
a.addEventListener('track', ({track}) => console.log('track from b', track));
b.addEventListener('datachannel', ({channel}) => console.log('datachannel from a', channel));
b.addEventListener('track', ({track}) => console.log('track from a', track));

//  - Option 2: Add Audio / Video tracks to the connection
const _transVid = a.addTransceiver('video');
const _transAud = b.addTransceiver('audio');

//  - Option 3: Trigger an ICE restart to find new network paths between the peers
a.restartIce();
