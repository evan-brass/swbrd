<script>
// Log everything.
async function log_everything(conn, label = conn.pid) {
	const logger = (...args) => console.log(label, ...args);
	['message', 'open', 'close'].forEach((e) =>
		conn.dc.addEventListener(e, logger)
	);
	[
		'connectionState',
		'iceConnectionState',
		'iceGatheringState',
		'signalingState',
	].forEach((p) => {
		conn.addEventListener(
			p.toLowerCase() + 'change',
			() => logger(p, conn[p]),
		);
	});
	[
		'icecandidate',
		'datachannel',
		'icecandidateerror',
		'negotiationneeded',
		'track',
	].forEach((e) => {
		conn.addEventListener(e, logger);
	});

	while (!conn.sctp) {
		await new Promise(res => conn.addEventListener('signalingstatechange', res, { once: true }));
	}
	conn.sctp.addEventListener('statechange', ({ target: { state } }) => logger('sctp state', state));
	conn.sctp.transport.addEventListener('error', ({ error }) => logger('dtls error', error));
	conn.sctp.transport.iceTransport.addEventListener('gatheringstatechange', ({ target: { gatheringState } }) => logger('ice transport gatheringState', gatheringState));
	conn.sctp.transport.iceTransport.addEventListener('statechange', ({ target: { state } }) => logger('ice transport state', state));
	conn.sctp.transport.iceTransport.addEventListener('selectedcandidatepairchange', ({ target }) => logger('ice transport selected', target.getSelectedCandidatePair()));
}
</script>

<script type="_module">
	import { Addr } from 'swbrd/addr.js';
		import { listen } from 'swbrd/listen.js';

		// Connect to my server
		const server_addr = new Addr(
			'turn:Zx9xDRd0OG9PxMGJhg3C8NDr65kn4kOivLoSNqXKCoW@stun.evan-brass.net?ice-lite',
		);
		// const server_addr = new Addr('turn:ucCm6JK3s22XuCRiTZVFpWajUq0tIpB7lDn1Sv8dRv3@localhost?ice-lite');

		const server = server_addr.connect();
		log_everything(server, 'server');

		// Make outgoing connections to all addrs in our url
		for (
			const param of new URLSearchParams(location.search).getAll('addr')
		) {
			const addr = new Addr(decodeURIComponent(param));
			if (addr.id == BigInt(server.cert)) continue; // Don't connect to yourself
			console.log(addr);
			const conn = addr.connect();
			log_everything(conn);
		}

		// Assemble our address
		const ours = new URL(location);
		ours.searchParams.set(
			'addr',
			`turn:${server.cert}@${server_addr.authority.host}`,
		);
		console.log(ours.href);

		const incoming = new Map(); // pid -> Conn
		for await (const candidate of listen(server)) {
			const inc = new Addr(
				`turn:${candidate.usernameFragment}@${server_addr.authority.host}`,
			);
			if (!inc.id || incoming.has(inc.id)) continue;
			if (BigInt(inc.id) == BigInt(server.cert)) {
				continue; // Don't connect to ourself
			}

			const conn = inc.connect({ setup: 'active' });
			conn.addIceCandidate(candidate); // Add the discovered candidate to the new connection
			incoming.set(conn.pid, conn);

			// Remove conn when it closes:
			conn.addEventListener(
				'connectionstatechange',
				({ target: { pid, connectionState } }) => {
					if (connectionState == 'closed') incoming.delete(pid);
				},
			);

			console.log('answered', conn);
		}
</script>

		const bytes = fingerprint.split(':').map((s) => parseInt(s, 16));
		const id = BigInt('0x' + fingerprint.replace(/:/g, ''));

		let actual = '';
		let rem = 0;
		for (let i = 0; i < Math.ceil(256 / Math.log2(charset.length)); ++i) {
			for (let i = 0; i < bytes.length; ++i) {
				const v = bytes[i] + rem * 256;
				bytes[i] = Math.trunc(v / charset.length);
				if (bytes[i] >= 256) debugger;
				rem = v % charset.length;
			}
			actual = charset[rem] + actual;
			if (bytes.every((i) => i == 0)) break;
			rem = 0;
		}
		const expected = base(id, { pad_length: 43 });
		console.log(actual, expected, actual == expected);

const idb = BigInt(certb);
