# Debian's stock /etc/nginx/nginx.conf has exactly one main-context include --
# modules-enabled/*.conf -- so that is where a top-level stream{} block has to
# go.  The 90- prefix sorts after 50-mod-stream.conf, so ngx_stream_module is
# already loaded by the time this is parsed.
stream {
	include /etc/nginx/stream-enabled/*.conf;
}
