# Every upstream here is reached over loopback, but it has to be reached over the
# *client's* address family: proxy_bind hands the socket an address of whatever
# family the client used, so an IPv4 client on an AF_INET6 upstream fails bind()
# with EINVAL and an IPv6 client on an AF_INET one fails setsockopt(IPV6_TRANSPARENT)
# with ENOPROTOOPT.  Naming the upstream `localhost` resolves to both 127.0.0.1 and
# ::1 and round-robins between them, so half of every client's connections died that
# way.  Pick the loopback address by client family instead.
map $remote_addr $lo {
	"~:"	"[::1]";
	default	127.0.0.1;
}

# turns
server {
	listen [::]:5349 ssl;
	listen 0.0.0.0:5349 ssl;
	server_name turn.evan-brass.net turn-4only.evan-brass.net stun.evan-brass.net;
	proxy_pass $lo:3478;
	proxy_bind $remote_addr transparent;

	ssl_certificate /etc/letsencrypt/live/turn.evan-brass.net/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/turn.evan-brass.net/privkey.pem;
}

map $ssl_preread_alpn_protocols $tls_port {
	~\bh2\b			8443;
	~\bhttp/1.1\b	8443;
	~\bstun.turn\b	5349;
	default			5349;
}
map $ssl_preread_protocol $port {
	""			22;
	default		$tls_port;
}

server {
	listen [::]:443;
	listen 0.0.0.0:443;
	proxy_pass $lo:$port;
	proxy_bind $remote_addr transparent;

	ssl_preread on;
}
