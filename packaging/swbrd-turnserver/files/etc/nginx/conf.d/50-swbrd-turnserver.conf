# Included from inside http{} by Debian's stock nginx.conf.  The stream server on
# :443 sends h2/http1.1 here on 8443; :443 quic is UDP so it does not collide with
# the stream server's TCP listener.
server {
	listen [::]:8443 ssl ipv6only=off;
	listen [::]:443 quic ipv6only=off;
	http2 on;

	root /var/www;
	index index.html;
	error_page 404 /404.html;

	server_name turn.evan-brass.net;
	ssl_certificate /etc/letsencrypt/live/turn.evan-brass.net/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/turn.evan-brass.net/privkey.pem;

	if ($host != turn.evan-brass.net) {
		return 444;
	}

	location / {
		add_header Alt-Svc 'h2=":443"; h3=":443";';
	}
}
server {
	listen [::]:80 ipv6only=off;
	server_name turn.evan-brass.net stun.evan-brass.net turn-4only.evan-brass.net;

	# ACME http-01. Must come before the redirect below: a server-level
	# if/return runs in the rewrite phase for every request and would
	# swallow the challenge. Every name in the cert has to answer here.
	location ^~ /.well-known/acme-challenge/ {
		root /var/www/acme;
		default_type text/plain;
	}

	location / {
		if ($host != turn.evan-brass.net) {
			return 444;
		}
		return 301 https://$host$request_uri;
	}
}
