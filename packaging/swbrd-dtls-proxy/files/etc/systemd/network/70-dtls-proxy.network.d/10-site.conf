# /96 giving (32 + ~16 - ~2) bits of random dtls cid.  The destination address
# and port together are the connection id, so the whole prefix has to route to
# the TUN.  fd01::/96 is the same thing reachable only from inside the VPN.
[Route]
Destination=2a01:4ff:1f0:7e46:0:4::/96
[Route]
Destination=fd01::/96

# The /96 plaintext is injected *from*.  The low 32 bits are the subscriber
# index, which is how the association the kernel forms gets attributed back to
# the DTLS connection that produced it -- so this has to route here too, and it
# must not overlap the deter prefix above.  Keep it in step with -p in
# /etc/default/swbrd-dtls-proxy.
[Route]
Destination=2a01:4ff:1f0:7e46:0:6::/96
