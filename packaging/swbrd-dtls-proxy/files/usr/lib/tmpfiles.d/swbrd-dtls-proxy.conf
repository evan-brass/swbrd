# Seed the deterministic-certificate key, but never overwrite an existing one.
C /var/lib/swbrd/key.pem 0640 swbrd swbrd - /usr/share/swbrd/key.pem

# Where extensions put their listening sockets.  The daemon dials into here, so
# it and the extensions have to share the directory; group-writable rather than
# world so an unrelated local user cannot squat an extension's path.
d /run/swbrd 0755 swbrd swbrd -
d /run/swbrd/ext 0770 swbrd swbrd -
