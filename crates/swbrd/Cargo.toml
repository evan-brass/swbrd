[package]
name = "swbrd"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
common = { path = "../common" }
eyre = "0.6.12"
ipnet = "2.12.0"
libc = "0.2.186"
mio = { version = "1.2.1", features = ["os-poll", "os-ext"] }
nix = { version = "0.31.3", features = ["net", "socket", "uio"] }
socket2 = { version = "0.6.4", features = ["all"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tun-rs = "2.8.3"
zerocopy = { version = "0.8.50", features = ["derive", "alloc"] }
sctp = { path = "../sctp" }
