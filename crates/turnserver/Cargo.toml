[package]
name = "turnserver"
version = "0.1.0"
edition = "2024"
license = "MIT-0"

[dependencies]
bytes = "1.11.1"
clap = { version = "4.4", features = ["derive"] }
common = { path = "../common" }
eyre = "0.6.12"
intrusive-collections = "0.10.2"
ipnet = "2.12.0"
libc = "0.2"
md5 = "0.8.1"
mio = { version = "1.2.1", features = ["os-poll", "os-ext", "net"] }
nix = { version = "0.31.3", features = ["socket", "uio"] }
rand = "0.10.1"
sha2 = "0.11.0"
socket2 = { version = "0.6.4", features = ["all"] }
socket3 = { path = "../socket3" }
stun = { path = "../stun" }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tun-rs = "2.8.3"
zerocopy = { version = "0.8.50", features = ["derive"] }
