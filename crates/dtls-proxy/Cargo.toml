[package]
name = "dtls-proxy"
version = "0.1.0"
edition = "2024"
license = "MIT-0"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
chan = { path = "../chan" }
common = { path = "../common" }
dtls = { path = "../dtls" }
eyre = "0.6.12"
ipnet = "2.12.0"
intrusive-collections = "0.10.3"
libc = "0.2"
mio = { version = "1.2.1", features = ["os-poll", "os-ext", "net"] }
openssl = "0.10.80"
sctp = { path = "../sctp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
signal-hook = "0.4.4"
socket2 = { version = "0.6.4", features = ["all"] }
socket3 = { path = "../socket3" }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tun-rs = "2.8.3"
zerocopy = { version = "0.8.50", features = ["derive", "alloc"] }
