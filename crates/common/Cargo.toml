[package]
name = "common"
version = "0.1.0"
edition = "2024"
license = "MIT-0"

[dependencies]
tun-rs = "2.8.3"
zerocopy = { version = "0.8.50", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", features = ["net", "socket", "uio"] }
socket2 = { version = "0.6.4", features = ["all"] }
