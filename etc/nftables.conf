#!/usr/sbin/nft -f

# The base file, owned by the admin (it is the `nftables` package's conffile, so
# no swbrd package can ship it).  Every swbrd package drops a fragment into
# /etc/nftables.d/ that declares, deletes and redefines only its own tables, so
# `nft -f` on one fragment is a safe incremental update and this file is the
# full rebuild used at boot.  A glob that matches nothing is not an error, so
# removing every swbrd package leaves this valid.
#
# Pushed by ./scripts/dev.sh nft.

flush ruleset
include "/etc/nftables.d/*.nft"
