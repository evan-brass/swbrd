#!/usr/sbin/nft -f

flush ruleset

table inet santa {
	# Keep a naughty list of ips that we've sent more than 40 rst in 1 min
	set naughty_list {
		type ipv4_addr
		size 300
		flags timeout
	}
	set rst_meter {
		type ipv4_addr
		size 100
		flags dynamic, timeout
		timeout 2m
	}
	chain input {
		type filter hook input priority filter;
		ip saddr 127.0.0.0/8 accept
		ip saddr @naughty_list reject
	}
	chain output {
		type filter hook output priority filter;
		# Everything nginx proxies takes a second trip over loopback, and tearing those
		# connections down is a normal source of rst.  Without this, ~20 proxied connections
		# put 127.0.0.1 on the naughty list, and the input chain then rejects the server's
		# own upstream traffic for 30 minutes.
		ip daddr 127.0.0.0/8 return
		tcp flags rst \
		update @rst_meter { ip daddr limit rate over 40/minute burst 40 packets } \
		add @naughty_list { ip daddr timeout 60m }
	}
}

table ip6 swbrd {
	chain dissolve {
		type filter hook prerouting priority -140;
		meta l4proto udp \
		@th,64,16 == 0x0001 \
		@th,96,32 == 0x2112A442 \
		@th,224,16 == 0x0006 \
		@th,256,64 == 0x646973736f6c7665 \
		@th,320,8 == 0x3a \
		meta mark set 1
	}
}

table inet transparent {
	chain divert1 {
		type filter hook prerouting priority -150;
		socket transparent 1 meta mark set 2 accept
	}
	chain divert2 {
		type route hook output priority -150;
		ip  saddr 127.0.0.0/8 ip  daddr != 127.0.0.0/8 meta mark set 2 accept
		ip6 saddr ::1         ip6 daddr != ::1         meta mark set 2 accept
	}
}

# Per-client byte/packet accounting for the turnserver's :3478 control+relay sockets.  Runs last
# so santa's naughty-list reject has already filtered abuse traffic before we count it.  `update`
# both inserts and refreshes an element's timeout, so active clients keep accumulating on a rolling
# window and idle ones age out on their own -- no separate cleanup needed.
table inet turn_acct {
	set in4 {
		type ipv4_addr
		size 4096
		flags dynamic, timeout
		timeout 1h
		counter
	}
	set in6 {
		type ipv6_addr
		size 4096
		flags dynamic, timeout
		timeout 1h
		counter
	}
	set out4 {
		type ipv4_addr
		size 4096
		flags dynamic, timeout
		timeout 1h
		counter
	}
	set out6 {
		type ipv6_addr
		size 4096
		flags dynamic, timeout
		timeout 1h
		counter
	}
	chain input {
		type filter hook input priority filter;
		tcp dport 3478 update @in4 { ip  saddr counter }
		tcp dport 3478 update @in6 { ip6 saddr counter }
		udp dport 3478 update @in4 { ip  saddr counter }
		udp dport 3478 update @in6 { ip6 saddr counter }
	}
	chain output {
		type filter hook output priority filter;
		tcp sport 3478 update @out4 { ip  daddr counter }
		tcp sport 3478 update @out6 { ip6 daddr counter }
		udp sport 3478 update @out4 { ip  daddr counter }
		udp sport 3478 update @out6 { ip6 daddr counter }
	}
}
